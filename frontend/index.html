<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Translúcida: la app se dibuja detrás de la hora y del notch / Dynamic Island,
         y cada pantalla se separa con env(safe-area-inset-top) (--safe-top), que iOS
         da con la medida exacta de cada iPhone. iOS 26 a veces deja el área visible
         más corta que la pantalla (WebKit 301108): lo corrige una regla de CSS en
         index.css (display-mode: standalone), sin medir nada con JavaScript.
         iOS lee esta etiqueta solo al instalar: hay que quitar la app de la pantalla
         de inicio y agregarla de nuevo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriFit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme: la app es solo oscura -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>NutriFit</title>
  </head>
  <!-- ontouchstart vacío: hace que :active funcione al tocar en iOS Safari -->
  <body ontouchstart="">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
