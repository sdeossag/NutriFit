<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black" y no "black-translucent": con translúcida, iOS 26 deja el área
         visible de la app instalada 62 pt más corta que la pantalla (unas veces sí y
         otras no) y todo lo fijado abajo queda desalineado. Con "black" la app ocupa
         exactamente el espacio bajo la barra de estado. iOS lee esta etiqueta solo al
         instalar: hay que quitar la app de la pantalla de inicio y agregarla de nuevo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="NutriFit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme: la app es solo oscura -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>NutriFit</title>
  </head>
  <!-- ontouchstart vacío: hace que :active funcione al tocar en iOS Safari -->
  <body ontouchstart="">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
